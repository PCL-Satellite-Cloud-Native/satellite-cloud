apiVersion: v1
kind: PersistentVolume
metadata:
  name: remote-sensing-data-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.10.112
    path: /export/remote-sensing-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: remote-sensing-data
  namespace: gitlab-runner
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  volumeName: remote-sensing-data-pv
