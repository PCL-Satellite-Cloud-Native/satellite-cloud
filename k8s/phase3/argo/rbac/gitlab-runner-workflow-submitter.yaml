# rs-worker ServiceAccount：在 gitlab-runner 提交 / 监视 Workflow
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rs-worker
  namespace: gitlab-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rs-workflow-submitter
  namespace: gitlab-runner
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtaskresults"]
    verbs: ["create", "get", "list", "watch", "patch", "update"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtemplates"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rs-workflow-submitter
  namespace: gitlab-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rs-workflow-submitter
subjects:
  - kind: ServiceAccount
    name: rs-worker
    namespace: gitlab-runner
