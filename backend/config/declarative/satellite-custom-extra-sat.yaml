# ====================================================================================
# Satellite CR 示例：新增一颗自定义卫星（星座管理 CRD 化）
#
# 场景：在 Scenario5_full_36x22 星座之外新增一颗编号 sat-99-1 的自定义卫星。
# 轨道参数全部显式声明；未声明字段（此处都声明了）会按场景构型推导兜底。
# 适用场景：批量构型之外的特殊卫星、单星演练。
# ====================================================================================

# --- 组/版本：对应未来 CRD 的 apiVersion ---
apiVersion: cloud.satellite.io/v1
# --- 资源类型：单颗卫星 ---
kind: Satellite
metadata:
  # 清单唯一标识（对应未来 CR 的 metadata.name）
  name: scenario5-custom-sat
  # K8s 风格标签
  labels:
    app.kubernetes.io/part-of: satellite-cloud     # 所属项目
    app.kubernetes.io/component: satellite         # 资源组件类型：卫星
spec:
  # 所属场景名（必须已存在：由 SatelliteConstellation 清单创建场景）
  scenarioName: Scenario5_full_36x22
  # 卫星标识（与 (plane, satInPlane) 至少提供一个；给了 satId 则以其为准）
  satId: sat-99-1
  # STK 名称（缺省为 Sat_{satId}）
  stkName: Sat_99_1
  # 星座定位（用于列表排序；satId 为空时推导 sat-{p}-{s}）
  plane: 99
  satInPlane: 1
  # 轨道根数（可空字段：创建时未声明按场景构型 Walker 规律推导）
  altKm: 600          # 轨道高度 km（sma 自动 = 6378.137 + 600）
  incDeg: 53          # 轨道倾角（度）
  raanDeg: 0          # 升交点赤经（度）
  argpDeg: 0          # 近地点幅角（度）
  taDeg: 0            # 真近点角（度）
  # ecc 未声明：创建时默认 0（近圆轨道）
