# od-worker 检测阶段 CPU 最重；无 GPU 时 HPA 仅按 CPU（Pilot max=2 保守）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: od-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: od-worker
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
