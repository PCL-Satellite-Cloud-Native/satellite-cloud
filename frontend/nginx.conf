server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源优先；SPA 路由才回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|xml|json|wasm|js|css|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
