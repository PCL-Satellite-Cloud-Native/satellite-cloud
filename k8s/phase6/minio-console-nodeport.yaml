# MinIO Web Console — NodePort（与 Grafana 30001 / Prometheus 30090 同类）
# 浏览器：http://<node-ip>:30901 ；S3 API 仍走 ClusterIP minio:9000
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  namespace: gitlab-runner
  labels:
    app: minio
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
