# Pilot：MinIO 数据卷 — worker22 **vdb** 本地路径（2T 盘）
# worker22 上 /export/minio-data 在 vda 系统盘（易 disk-pressure Evicted）；
# 定稿使用 vdb 挂载点内路径：
#   /export/remote-sensing-data/minio-data
# 部署前在 worker22：
#   sudo mkdir -p /export/remote-sensing-data/minio-data
#   sudo chmod 0777 /export/remote-sensing-data/minio-data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-data-pv
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /export/remote-sensing-data/minio-data
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker22
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: gitlab-runner
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  volumeName: minio-data-pv
