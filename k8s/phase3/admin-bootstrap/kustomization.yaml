# 集群管理员一次性 apply（GitLab CI 无权创建 ClusterRole / 跨 namespace 资源）
#   kubectl apply -f k8s/gitlab-runner-ci-rbac-phase3.yaml
#   kubectl apply -f k8s/phase3/argo/gitlab-runner-ci-rbac-argo-ns.yaml
#   kubectl apply -k k8s/phase3/admin-bootstrap/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../phase1/rs-worker/serviceaccount.yaml
  - ../argo/rbac/gitlab-runner-workflow-submitter.yaml
  - ../argo/rbac/controller-clusterrole.yaml
