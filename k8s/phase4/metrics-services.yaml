apiVersion: v1
kind: Service
metadata:
  name: rs-worker-metrics
  namespace: gitlab-runner
  labels:
    app: rs-worker
    satellite.io/metrics: "true"
spec:
  selector:
    app: rs-worker
  ports:
    - name: metrics
      port: 9090
      # 用数字端口：即使 PodSpec 未声明 name: metrics 也能进 Endpoints
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: od-worker-metrics
  namespace: gitlab-runner
  labels:
    app: od-worker
    satellite.io/metrics: "true"
spec:
  selector:
    app: od-worker
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
