# 授权 gitlab-runner 在 gitlab-runner namespace 管理 DaemonSet + WorkflowTemplate（P5-06b / P5-05）
#
# 【集群管理员一次性执行】在 k8s-master：
#   kubectl apply -f k8s/gitlab-runner-ci-rbac-phase5.yaml
#
# 节点打标 satellite.io/id 与 worker-node-reader ClusterRole 仍需 cluster-admin：
#   bash scripts/phase5_label_nodes.sh --apply
#   kubectl apply -f k8s/phase5/worker-node-reader.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner-ci-phase5
  namespace: gitlab-runner
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-ci-phase5
  namespace: gitlab-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner-ci-phase5
subjects:
  - kind: ServiceAccount
    name: gitlab-runner
    namespace: gitlab-runner
