# 授权 gitlab-runner ServiceAccount 在 argo namespace 部署 workflow-controller
#
# 【必须】Phase 3 首次启用 CI 部署前，由集群管理员执行一次：
#   kubectl apply -f k8s/phase3/argo/gitlab-runner-ci-rbac-argo-ns.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner-argo
  namespace: argo
rules:
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-argo
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner-argo
subjects:
  - kind: ServiceAccount
    name: gitlab-runner
    namespace: gitlab-runner
